# QMIX Multi-Agent Configuration

# Runtime data locations. Two independent roots, both defaulting to the current
# working directory (= the project root when run from there), so standalone use
# is unaffected: ./chroma_data, ./output and the trace stay at the project root.
#
#   data_root   — base for *used* resources, notably the vector DB.
#   output_root — base for files the pipeline *produces* (reports, traces).
#                 Defaults to data_root. A host typically sets ONLY this to group
#                 generated artifacts in one folder at its root WITHOUT moving the
#                 DB, e.g.  output_root: qmix_report_writer_data
#
# Relative path values resolve under their root; absolute values are used as-is.
# Env equivalents: QMIX_REPORT_DATA_ROOT, QMIX_REPORT_OUTPUT_ROOT, and
# QMIX_REPORT_CONFIG to load a whole override file.
paths:
  # data_root: /abs/path                 # override the DB / used-resource base
  # output_root: qmix_report_writer_data # host: group produced files in one folder
  chroma_path: chroma_data               # ChromaDB persistent store (under data_root)
  tools_dir: .tools                      # cache for auto-downloaded Tectonic (under data_root)
  output_dir: output                     # one sub-folder per report run (under output_root)
  trace_file: handcrafted_trace.json     # execution trace dump (under output_root)

# QMIX network/trainer hyperparameters, consumed by the qmix runner
# (qmix/runner.py — upgrade-plan Stage 4.6; CLI flags override these).
# The action count is NOT configured here: it is defined in code
# (qmix/agent_network.py NUM_ACTIONS) and obs/state dims derive from the
# observation builder.
qmix:
  gnn_hidden_dim: 128
  gnn_layers: 2
  rnn_hidden_dim: 128
  mixing_hidden_dim: 64
  lr: 5e-4
  gamma: 0.99
  # Gradient steps between hard target updates. At train_steps_per_episode=6
  # this refreshes the target roughly every ~17 episodes. The optimizer-
  # stability sweep (2026-07-09) showed no divergence across lr 1e-4..1e-3 ×
  # target_update 50/100/200 at the real data scale — 100 kept as a safe middle.
  target_update_interval: 100
  buffer_capacity: 5000
  batch_size: 32
  grad_clip: 10.0
  training:
    # Recommended first-campaign defaults (validated 2026-07-09). Episodes are
    # expensive (~15 min each on the 30B). If you change the run length, keep
    # num_episodes and epsilon_decay_episodes ~proportional (decay ≈ 60% of
    # num_episodes). Track a run with experiments/monitor_training.py.
    num_episodes: 500
    epsilon_start: 1.0
    epsilon_end: 0.05
    # Episodes over which ε anneals start→end. null/0 → the whole run (ε only
    # floors on the final episode). At 150 (~60% of 250) ε reaches its floor
    # mid-run, so the back half exploits the learned policy instead of exploring.
    epsilon_decay_episodes: 250
    save_interval: 10            # checkpoint + buffer sidecar every N episodes
    # Training-loop engineering (plan 4.1/4.2/4.4/4.5):
    train_steps_per_episode: 6   # gradient steps per episode — squeeze more learning from each costly episode
    min_buffer_episodes: 5       # warmup: start gradient steps once the buffer holds this many episodes
    eval_interval: 25            # greedy eval episode (eps=0, not buffered) every N episodes; 0 disables
    seed: 42                     # reproducible; set null for varied/independent runs
    persist_buffer: true         # save the replay buffer next to checkpoints; --resume reloads it
  obs:
    # Observation text features (task + progress summary). By default they are
    # cheap byte-hashes. Set use_embeddings: true to replace them with
    # nomic-embed-text embeddings (served by the same local Ollama as the RAG),
    # truncated to embedding_dim. embedding_dim sets the width of EACH text slot
    # for both modes, so leaving it at 16 keeps obs_dim identical whether
    # embeddings are on or off (a clean A/B for the training rework).
    use_embeddings: false
    embedding_dim: 16

reward:
  # Reward v2 (training_eval plan 2.4 — TD1/TD2): per append event the reward
  # is quality_weight * grounded_chunk_score + length_weight * delta_length_gauss,
  # landing on the event step only (OD-A); at run end macro_weight * macro_score
  # is added to the final step; token_weight * tokens/10k is subtracted per
  # recorded step (TD2: flag-gated, ships DISABLED at 0.0).
  quality_weight: 1.0
  macro_weight: 1.0
  length_weight: 0.1
  token_weight: 0.0
  length_goal: 25000  # 25000 char -> ~4500 words -> ~1 scientific document
  length_sigma: 8500  # sigma of the gaussian curve: 8500 -> reward start at ~5000 char
  # LLM-judge settings (training_eval plan 1.2) — the judges are deliberately
  # independent of the actors' --llm flag.
  judge:
    model:            # null -> llm.default_model; set to pin a dedicated judge model
    temperature: 0.0  # judges must be deterministic — the reward is not a sample
    max_tokens: 3072  # headroom: replies truncated mid-notes are unusable (reason-first)
    retries: 2        # re-asks on unusable replies (resampled at temp>=0.35), then the event is skipped
    # Judge calls use Ollama's NATIVE /api/chat structured outputs (grammar-
    # constrained decoding; the OpenAI-compat json_schema is ignored by some
    # Ollama versions). num_ctx must fit the macro judge's prompt — the FULL
    # report plus instructions (10-15k tokens for a long document). Lower it
    # if VRAM is tight; Ollama silently truncates the prompt when it overflows.
    num_ctx: 32768

rag:
  # Reranking mode applied after RRF fusion.
  # Options: "nomic" (nomic-embed-text cosine, default), "cross_encoder" (BAAI/bge-reranker-base)
  rerank_mode: nomic
  # Chunks returned per query during PLANNING only (topic discovery, breadth over depth).
  top_k_planning: 3
  # Chunks returned per query during RESEARCH, DRAFTING, and SECTION_REVIEW (evidence gathering).
  top_k_drafting: 5
  # Minimum BM25-only chunks guaranteed per retrieval result.
  # Only injects if the BM25 chunk ranked in the top-10 of the RRF pool (genuinely competitive).
  # Falls back to all-vector if no qualifying BM25 chunk exists. Set to 0 to disable.
  bm25_floor: 1

pbds:
  # PBDS dependency-graph tool. It reads an Excel parameter workbook (.xlsx) whose
  # formulas define the dependency graph between reactor parameters. The tool
  # activates ONLY when a readable file exists at workbook_path; when the file is
  # missing the pipeline runs unchanged (silent skip).
  #
  # Relative paths resolve under the data root (like the vector DB); absolute paths
  # are used as-is. Left unset here, the path falls back to the
  # QMIX_REPORT_PBDS_WORKBOOK env var, then to 'pbds_parameters.xlsx' under the data
  # root. Overload it from a host the same ways as the other config:
  #   - configure(overrides={"pbds": {"workbook_path": "/abs/params.xlsx"}})
  #   - a QMIX_REPORT_CONFIG override YAML setting pbds.workbook_path
  #   - the QMIX_REPORT_PBDS_WORKBOOK environment variable
  # workbook_path: /abs/or/relative/params.xlsx
  workbook_path:

llm:
  default_model: alibayram/Qwen3-30B-A3B-Instruct-2507
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  max_tokens: 4096
  providers:
    ollama:
      base_url: http://localhost:11434
      models:
        - tinyllama
        - qwen3:4b
        - qwen3:8b
        - alibayram/Qwen3-30B-A3B-Instruct-2507

agent_configs:
  redacting:
    agents: [LeadArchitect, Researcher, DataAnalyst, Reviewer, Collector]
    respective_ollama_urls:
      LeadArchitect: http://localhost:11434
      Researcher: http://localhost:11434
      DataAnalyst: http://localhost:11434
      Reviewer: http://localhost:11434
      Collector: http://localhost:11434
    respective_max_tokens:
      # Ceilings cover thinking tokens + output tokens (qwen3 thinking overhead ~200-400t).
      # Calibrated to cut runaway loops (~4000t in trace 1) while allowing normal operation.
      # Other agents (Reviewer, Collector) keep the global max_tokens (4096).
      LeadArchitect: 1500
      Researcher: 1500     # output max ~471t + thinking overhead → 1200
      DataAnalyst: 2000    # output max ~479t + thinking overhead → raised for richer section content
